<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choi's Pantry | e-Transfer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: #f8f4ea;
  color: #123f30;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* ---------- CORNER SHAPES ---------- */

.shape {
  position: fixed;
  z-index: 0;
  border-radius: 45%;
}

.green {
  width: 38vw;
  height: 38vw;
  background: #194d3b;
  top: -25vw;
  left: -12vw;
  transform: rotate(-15deg);
}

.orange {
  width: 32vw;
  height: 32vw;
  background: #c9542f;
  top: -22vw;
  right: -10vw;
}

.yellow {
  width: 38vw;
  height: 38vw;
  background: #e5ae38;
  bottom: -27vw;
  left: -14vw;
  transform: rotate(15deg);
}

.sage {
  width: 35vw;
  height: 35vw;
  background: #a8b99c;
  bottom: -25vw;
  right: -13vw;
}


/* ---------- MAIN ---------- */

.container {
  position: relative;
  z-index: 2;

  width: min(90%, 560px);
  text-align: center;
}


/* ---------- LOGO ---------- */

.logo {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: bold;
  font-size: clamp(48px, 8vw, 76px);
  line-height: 1;
  margin-bottom: 22px;
  letter-spacing: -3px;
}


/* ---------- LEAF APOSTROPHE ---------- */

.apostrophe {
  position: relative;
  display: inline-block;
  width: 20px;
  height: 35px;
  margin: 0 1px;
}

.leaf {
  position: absolute;
  width: 13px;
  height: 24px;
  background: #194d3b;
  border-radius: 100% 0 100% 0;
}

.leaf.one {
  left: 1px;
  top: 7px;
  transform: rotate(-35deg);
}

.leaf.two {
  left: 10px;
  top: -3px;
  transform: rotate(20deg);
}


/* ---------- BRAND LINE ---------- */

.tagline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;

  font-size: 13px;
  letter-spacing: 5px;
  margin-bottom: 70px;
}

.tagline::before,
.tagline::after {
  content: "";
  width: 50px;
  height: 1px;
  background: #194d3b;
}


/* ---------- TRANSFER ---------- */

.transfer {
  font-size: 25px;
  font-weight: 700;
  margin-bottom: 22px;
}


/* ---------- EMAIL BOX ---------- */

.email-box {
  display: flex;
  background: white;

  border: 2px solid #194d3b;
  border-radius: 16px;

  overflow: hidden;

  box-shadow:
    0 10px 30px rgba(25,77,59,0.08);
}

.email {
  flex: 1;
  padding: 20px 12px;

  font-size: 17px;
  color: #222;
}

button {
  border: 0;
  background: #194d3b;
  color: white;

  padding: 0 24px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background: #103a2c;
}


/* ---------- MESSAGE ---------- */

#message {
  height: 28px;
  margin-top: 14px;

  font-size: 14px;
  font-weight: bold;
}


/* ---------- FOOTER ---------- */

.autodeposit {
  margin-top: 6px;

  font-size: 13px;
  color: #65756d;
}

.location {
  margin-top: 55px;

  font-size: 12px;
  letter-spacing: 5px;
}


/* ---------- MOBILE ---------- */

@media (max-width: 600px) {

  .container {
    width: 88%;
  }

  .logo {
    font-size: 49px;
  }

  .tagline {
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 55px;
  }

  .email {
    font-size: 14px;
  }

  button {
    padding: 0 18px;
  }

  .green,
  .yellow {
    width: 65vw;
    height: 65vw;
  }

  .orange,
  .sage {
    width: 55vw;
    height: 55vw;
  }

}

</style>
</head>


<body>

<div class="shape green"></div>
<div class="shape orange"></div>
<div class="shape yellow"></div>
<div class="shape sage"></div>


<main class="container">

  <div class="logo">
    Choi<span class="apostrophe">
      <span class="leaf one"></span>
      <span class="leaf two"></span>
    </span>s Pantry
  </div>


  <div class="tagline">
    SMALL BATCH · FRESH FOOD
  </div>


  <div class="transfer">
    e-Transfer
  </div>


  <div class="email-box">

    <div class="email">
      709kimchi@gmail.com
    </div>

    <button id="copyButton" onclick="copyEmail()">
      COPY
    </button>

  </div>


  <div id="message"></div>


  <div class="autodeposit">
    Auto-deposit enabled
  </div>


  <div class="location">
    ST. JOHN'S, NL
  </div>

</main>


<script>

async function copyEmail() {

  const email = "709kimchi@gmail.com";

  try {

    await navigator.clipboard.writeText(email);

    document.getElementById("message").innerText =
      "✓ Email copied";

    document.getElementById("copyButton").innerText =
      "COPIED";

  } catch {

    document.getElementById("message").innerText =
      "709kimchi@gmail.com";

  }

}

</script>

</body>
</html>
