<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choi's Pantry | e-Transfer</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cream: #f7f2e8;
  --green: #153f31;
  --orange: #c9532f;
  --mustard: #e6ae3b;
  --sage: #a9b99d;
  --muted: #6e7c73;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--cream);
  color: var(--green);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.page {
  position: relative;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 44px 22px;
}

/* -------------------------
   ORGANIC CORNERS
------------------------- */

.blob {
  position: absolute;
  z-index: 0;
  pointer-events: none;
}

.blob.green {
  width: 430px;
  height: 330px;
  top: -145px;
  left: -145px;
  background: var(--green);
  border-radius: 34% 66% 67% 33% / 42% 38% 62% 58%;
  transform: rotate(-14deg);
}

.blob.orange {
  width: 390px;
  height: 290px;
  top: -120px;
  right: -140px;
  background: var(--orange);
  border-radius: 63% 37% 38% 62% / 46% 31% 69% 54%;
  transform: rotate(12deg);
}

.blob.mustard {
  width: 450px;
  height: 320px;
  bottom: -165px;
  left: -175px;
  background: var(--mustard);
  border-radius: 41% 59% 69% 31% / 67% 42% 58% 33%;
  transform: rotate(10deg);
}

.blob.sage {
  width: 400px;
  height: 300px;
  bottom: -155px;
  right: -155px;
  background: var(--sage);
  border-radius: 61% 39% 35% 65% / 41% 61% 39% 59%;
  transform: rotate(-9deg);
}

/* -------------------------
   MAIN CONTENT
------------------------- */

.card {
  position: relative;
  z-index: 2;
  width: min(92vw, 560px);
  text-align: center;
  padding: 20px 0;
}

/* -------------------------
   LOGO
------------------------- */

.logo-wrap {
  margin-bottom: 14px;
}

.logo {
  display: inline-flex;
  align-items: flex-start;
  justify-content: center;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  font-size: clamp(50px, 8vw, 78px);
  line-height: 0.95;
  letter-spacing: -3px;
}

.logo-word {
  display: inline-block;
}

/* leaf apostrophe */
.leaf-mark {
  position: relative;
  display: inline-block;
  width: 24px;
  height: 34px;
  margin: 0 2px;
  top: -8px;
}

.leaf {
  position: absolute;
  display: block;
  background: var(--green);
}

.leaf.small {
  width: 10px;
  height: 18px;
  left: 1px;
  top: 13px;
  border-radius: 100% 0 100% 0;
  transform: rotate(-42deg);
}

.leaf.large {
  width: 13px;
  height: 23px;
  right: 0;
  top: 0;
  border-radius: 100% 0 100% 0;
  transform: rotate(26deg);
}

.tagline {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
  font-size: 12px;
  letter-spacing: 5px;
  white-space: nowrap;
}

.tagline::before,
.tagline::after {
  content: "";
  width: 55px;
  height: 1.5px;
  background: var(--green);
}

.location {
  margin-top: 24px;
  font-size: 12px;
  letter-spacing: 5px;
}

/* -------------------------
   PAYMENT AREA
------------------------- */

.payment {
  margin-top: 82px;
}

.transfer-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 26px;
}

.email-box {
  display: flex;
  overflow: hidden;
  background: white;
  border: 2px solid var(--green);
  border-radius: 18px;
  box-shadow: 0 12px 28px rgba(21, 63, 49, 0.08);
}

.email {
  flex: 1;
  padding: 19px 16px;
  font-size: 17px;
  color: #222;
  background: white;
  white-space: nowrap;
}

.copy-btn {
  border: 0;
  background: var(--green);
  color: white;
  font-size: 14px;
  font-weight: 800;
  padding: 0 26px;
  cursor: pointer;
  min-width: 112px;
}

.copy-btn:active {
  background: #0d2f24;
}

.message {
  min-height: 24px;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 700;
}

.autodeposit {
  margin-top: 18px;
  font-size: 14px;
  color: var(--muted);
}

/* -------------------------
   MOBILE
------------------------- */

@media (max-width: 600px) {
  .page {
    align-items: flex-start;
    padding-top: 120px;
  }

  .card {
    width: 100%;
  }

  .logo {
    font-size: 54px;
    letter-spacing: -2.5px;
  }

  .leaf-mark {
    width: 21px;
    height: 31px;
    top: -7px;
  }

  .tagline {
    margin-top: 24px;
    font-size: 10px;
    letter-spacing: 3.6px;
    gap: 10px;
  }

  .tagline::before,
  .tagline::after {
    width: 42px;
  }

  .location {
    margin-top: 20px;
    font-size: 11px;
    letter-spacing: 4px;
  }

  .payment {
    margin-top: 70px;
  }

  .transfer-title {
    font-size: 25px;
    margin-bottom: 24px;
  }

  .email {
    font-size: 14px;
    padding: 18px 12px;
  }

  .copy-btn {
    min-width: 96px;
    padding: 0 18px;
  }

  .blob.green {
    width: 315px;
    height: 240px;
    top: -112px;
    left: -125px;
  }

  .blob.orange {
    width: 295px;
    height: 220px;
    top: -98px;
    right: -120px;
  }

  .blob.mustard {
    width: 320px;
    height: 235px;
    bottom: -135px;
    left: -140px;
  }

  .blob.sage {
    width: 300px;
    height: 220px;
    bottom: -132px;
    right: -135px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="blob green"></div>
  <div class="blob orange"></div>
  <div class="blob mustard"></div>
  <div class="blob sage"></div>

  <main class="card">

    <div class="logo-wrap">

      <div class="logo">
        <span class="logo-word">Choi</span>

        <span class="leaf-mark">
          <span class="leaf small"></span>
          <span class="leaf large"></span>
        </span>

        <span class="logo-word">s Pantry</span>
      </div>

      <div class="tagline">
        SMALL BATCH · FRESH FOOD
      </div>

      <div class="location">
        ST. JOHN'S, NL
      </div>

    </div>


    <section class="payment">

      <div class="transfer-title">
        e-Transfer
      </div>

      <div class="email-box">

        <div class="email">
          709kimchi@gmail.com
        </div>

        <button class="copy-btn" id="copyButton" onclick="copyEmail()">
          COPY
        </button>

      </div>

      <div class="message" id="message"></div>

      <div class="autodeposit">
        Auto-deposit enabled
      </div>

    </section>

  </main>

</div>


<script>
async function copyEmail() {
  const email = "709kimchi@gmail.com";
  const button = document.getElementById("copyButton");
  const message = document.getElementById("message");

  try {
    await navigator.clipboard.writeText(email);

    button.innerText = "COPIED";
    message.innerText = "✓ Email copied";

    setTimeout(() => {
      button.innerText = "COPY";
      message.innerText = "";
    }, 1800);

  } catch {
    message.innerText = email;
  }
}
</script>

</body>
</html>
