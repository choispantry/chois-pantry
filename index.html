<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Choi's Pantry | e-Transfer</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --cream: #f7f2e8;
  --green: #153f31;
  --muted: #748078;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--green);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100svh;
}


/* =========================
   WHOLE PAGE
========================= */

.page {
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;

  display: flex;
  flex-direction: column;

  background: var(--cream);
}


/* =========================
   BRAND HEADER
========================= */

.header {
  width: 100%;
  flex-shrink: 0;
}

.header img {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
}


/* =========================
   PAYMENT AREA
========================= */

.payment-area {
  width: 100%;

  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    30px
    22px
    max(50px, env(safe-area-inset-bottom));
}


/* =========================
   PAYMENT CONTENT
========================= */

.payment {
  width: min(88vw, 520px);

  text-align: center;

  transform: translateY(-25px);
}


/* =========================
   E-TRANSFER TITLE
========================= */

.payment-title {
  margin: 0 0 28px;

  color: var(--green);

  font-size: 28px;
  font-weight: 700;
}


/* =========================
   EMAIL + COPY
========================= */

.email-box {
  display: flex;

  width: 100%;

  overflow: hidden;

  background: white;

  border: 2px solid var(--green);

  border-radius: 18px;

  box-shadow:
    0 10px 28px
    rgba(21, 63, 49, 0.08);
}


.email {
  flex: 1;
  min-width: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 19px 10px;

  color: #222;

  font-size: 16px;

  white-space: nowrap;
}


.copy-button {
  min-width: 105px;

  padding: 0 20px;

  border: 0;

  background: var(--green);

  color: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}


.copy-button:active {
  background: #0d3025;
}


/* =========================
   COPY MESSAGE
========================= */

.message {
  height: 26px;

  margin-top: 14px;

  color: var(--green);

  font-size: 14px;
  font-weight: 700;
}


/* =========================
   AUTO-DEPOSIT
========================= */

.autodeposit {
  margin-top: 10px;

  color: var(--muted);

  font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .page {
    min-height: 100svh;
  }


  .header img {
    width: 100%;
    height: auto;
  }


  .payment-area {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
      20px
      22px
      max(55px, env(safe-area-inset-bottom));
  }


  .payment {
    width: 100%;

    max-width: 390px;

    transform: translateY(-35px);
  }


  .payment-title {
    margin-bottom: 28px;

    font-size: 27px;
  }


  .email {
    padding: 18px 8px;

    font-size: 14px;
  }


  .copy-button {
    min-width: 95px;

    padding: 0 14px;

    font-size: 14px;
  }


  .message {
    margin-top: 13px;
  }


  .autodeposit {
    margin-top: 8px;

    font-size: 14px;
  }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 380px) {

  .payment-area {
    padding-left: 18px;
    padding-right: 18px;
  }


  .email {
    font-size: 13px;
  }


  .copy-button {
    min-width: 82px;

    padding: 0 10px;

    font-size: 13px;
  }

}

</style>
</head>


<body>

<div class="page">


  <!-- Choi's Pantry brand image -->

  <header class="header">

    <img
      src="chois-pantry-header.png"
      alt="Choi's Pantry — Small Batch Fresh Food, St. John's NL"
    >

  </header>



  <!-- Payment section -->

  <div class="payment-area">

    <main class="payment">


      <div class="payment-title">
        e-Transfer
      </div>



      <div class="email-box">


        <div class="email">
          709kimchi@gmail.com
        </div>


        <button
          class="copy-button"
          id="copyButton"
          onclick="copyEmail()"
        >
          COPY
        </button>


      </div>



      <div
        class="message"
        id="message"
      ></div>



      <div class="autodeposit">
        Auto-deposit enabled
      </div>


    </main>

  </div>


</div>



<script>

async function copyEmail() {

  const email = "709kimchi@gmail.com";

  const button =
    document.getElementById("copyButton");

  const message =
    document.getElementById("message");


  try {

    await navigator.clipboard.writeText(email);

    button.innerText = "COPIED";

    message.innerText = "✓ Email copied";


    setTimeout(() => {

      button.innerText = "COPY";

      message.innerText = "";

    }, 1800);


  } catch {

    message.innerText =
      "709kimchi@gmail.com";

  }

}

</script>

</body>
</html>
