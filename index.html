<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Choi's Pantry | e-Transfer</title>


<style>

* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  padding: 0;

  background: #f7f2e8;

  color: #153f31;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body {
  min-height: 100vh;
}


.page {
  width: 100%;
  min-height: 100vh;

  background: #f7f2e8;
}


/* ==========================
   CHOI'S PANTRY HEADER
========================== */

.header {
  width: 100%;

  display: flex;
  justify-content: center;

  overflow: hidden;
}


.header img {
  display: block;

  width: 100%;
  max-width: 1200px;

  height: auto;
}


/* ==========================
   PAYMENT AREA
========================== */

.payment {
  width: min(88%, 520px);

  margin: 55px auto 0;

  text-align: center;
}


.payment-title {
  margin: 0 0 25px;

  color: #153f31;

  font-size: 28px;
  font-weight: 700;
}


/* ==========================
   EMAIL + COPY
========================== */

.email-box {
  display: flex;

  width: 100%;

  overflow: hidden;

  background: white;

  border: 2px solid #153f31;

  border-radius: 18px;

  box-shadow:
    0 10px 28px
    rgba(21, 63, 49, 0.08);
}


.email {
  flex: 1;

  min-width: 0;

  padding: 19px 10px;

  color: #222;

  font-size: 16px;

  white-space: nowrap;
}


.copy-button {
  min-width: 105px;

  padding: 0 20px;

  border: 0;

  background: #153f31;

  color: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}


.copy-button:active {
  background: #0d3025;
}


/* ==========================
   COPY CONFIRMATION
========================== */

.message {
  height: 25px;

  margin-top: 14px;

  color: #153f31;

  font-size: 14px;
  font-weight: 700;
}


.autodeposit {
  margin-top: 8px;

  color: #748078;

  font-size: 14px;
}


/* ==========================
   MOBILE
========================== */

@media (max-width: 600px) {

  .header img {
    width: 100%;

    height: auto;
  }


  .payment {
    width: 88%;

    margin-top: 42px;
  }


  .payment-title {
    margin-bottom: 24px;

    font-size: 26px;
  }


  .email {
    padding: 18px 8px;

    font-size: 14px;
  }


  .copy-button {
    min-width: 92px;

    padding: 0 14px;
  }


  .autodeposit {
    font-size: 14px;
  }

}

</style>

</head>


<body>


<div class="page">


  <!--
    This uses the actual Choi's Pantry
    artwork uploaded to GitHub.
  -->

  <header class="header">

    <img
      src="chois-pantry-header.png"
      alt="Choi's Pantry — Small Batch Fresh Food, St. John's NL"
    >

  </header>



  <!-- e-Transfer -->

  <main class="payment">


    <div class="payment-title">

      e-Transfer

    </div>



    <div class="email-box">


      <div class="email">

        709kimchi@gmail.com

      </div>



      <button
        class="copy-button"
        id="copyButton"
        onclick="copyEmail()"
      >

        COPY

      </button>


    </div>



    <div
      class="message"
      id="message"
    ></div>



    <div class="autodeposit">

      Auto-deposit enabled

    </div>


  </main>


</div>



<script>

async function copyEmail() {

  const email =
    "709kimchi@gmail.com";


  const button =
    document.getElementById(
      "copyButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  try {

    await navigator.clipboard.writeText(
      email
    );


    button.innerText =
      "COPIED";


    message.innerText =
      "✓ Email copied";


    setTimeout(() => {

      button.innerText =
        "COPY";

      message.innerText =
        "";

    }, 1800);


  } catch {

    message.innerText =
      "709kimchi@gmail.com";

  }

}

</script>


</body>

</html>
