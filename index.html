<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choi's Pantry | e-Transfer</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --cream: #f7f2e8;
  --green: #153f31;
  --orange: #c9532f;
  --mustard: #e6ae3b;
  --sage: #a9b99d;
  --muted: #748078;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--cream);
  color: var(--green);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.page {
  position: relative;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 40px 22px;
}


/* =========================
   CORNER SHAPES
========================= */

.blob {
  position: fixed;
  z-index: 0;
  pointer-events: none;
}

.green {
  width: 310px;
  height: 220px;

  top: -125px;
  left: -125px;

  background: var(--green);

  border-radius:
    35% 65% 62% 38% /
    42% 35% 65% 58%;

  transform: rotate(-12deg);
}

.orange {
  width: 285px;
  height: 205px;

  top: -115px;
  right: -120px;

  background: var(--orange);

  border-radius:
    65% 35% 38% 62% /
    42% 38% 62% 58%;

  transform: rotate(11deg);
}

.mustard {
  width: 315px;
  height: 215px;

  bottom: -135px;
  left: -135px;

  background: var(--mustard);

  border-radius:
    40% 60% 68% 32% /
    65% 42% 58% 35%;

  transform: rotate(8deg);
}

.sage {
  width: 290px;
  height: 205px;

  bottom: -130px;
  right: -125px;

  background: var(--sage);

  border-radius:
    62% 38% 35% 65% /
    42% 62% 38% 58%;

  transform: rotate(-8deg);
}


/* =========================
   MAIN CONTENT
========================= */

.card {
  position: relative;
  z-index: 2;

  width: min(92vw, 560px);

  text-align: center;
}


/* =========================
   LOGO
========================= */

.logo {
  display: block;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight: 700;

  font-size: 66px;
  line-height: 1;

  letter-spacing: -4px;

  white-space: nowrap;
}


/* =========================
   LEAF APOSTROPHE
========================= */

.leaf-mark {
  position: relative;

  display: inline-block;

  width: 20px;
  height: 32px;

  margin: 0 1px;

  top: -10px;
}

.leaf {
  position: absolute;
  display: block;

  background: var(--green);
}

.leaf-small {
  width: 9px;
  height: 17px;

  left: 0;
  top: 13px;

  border-radius:
    100% 0 100% 0;

  transform: rotate(-38deg);
}

.leaf-large {
  width: 12px;
  height: 22px;

  right: 0;
  top: 0;

  border-radius:
    100% 0 100% 0;

  transform: rotate(25deg);
}


/* =========================
   TAGLINE
========================= */

.tagline {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 14px;

  margin-top: 25px;

  font-size: 12px;

  letter-spacing: 5px;

  white-space: nowrap;
}

.tagline::before,
.tagline::after {
  content: "";

  width: 55px;
  height: 1px;

  background: var(--green);
}


/* =========================
   LOCATION
========================= */

.location {
  margin-top: 22px;

  font-size: 11px;

  letter-spacing: 5px;
}


/* =========================
   PAYMENT
========================= */

.payment {
  margin-top: 80px;
}

.transfer-title {
  margin-bottom: 25px;

  font-size: 27px;

  font-weight: 700;
}


/* =========================
   EMAIL
========================= */

.email-box {
  display: flex;

  width: 100%;

  overflow: hidden;

  background: white;

  border: 2px solid var(--green);

  border-radius: 18px;

  box-shadow:
    0 10px 25px
    rgba(21, 63, 49, 0.08);
}

.email {
  flex: 1;

  padding: 19px 12px;

  background: white;

  color: #222;

  font-size: 16px;

  white-space: nowrap;
}


/* =========================
   COPY BUTTON
========================= */

.copy-btn {
  min-width: 110px;

  padding: 0 22px;

  border: none;

  background: var(--green);

  color: white;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;
}

.copy-btn:active {
  background: #0d3025;
}


/* =========================
   COPY MESSAGE
========================= */

.message {
  min-height: 25px;

  margin-top: 13px;

  font-size: 14px;

  font-weight: 700;
}


/* =========================
   AUTO DEPOSIT
========================= */

.autodeposit {
  margin-top: 14px;

  color: var(--muted);

  font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .page {
    align-items: flex-start;

    padding:
      125px
      22px
      80px;
  }


  .card {
    width: 100%;
  }


  .logo {
    font-size: 46px;

    letter-spacing: -3px;

    white-space: nowrap;
  }


  .leaf-mark {
    width: 17px;
    height: 28px;

    top: -7px;
  }


  .leaf-small {
    width: 8px;
    height: 15px;

    top: 12px;
  }


  .leaf-large {
    width: 11px;
    height: 20px;
  }


  .tagline {
    margin-top: 24px;

    gap: 9px;

    font-size: 9px;

    letter-spacing: 3px;
  }


  .tagline::before,
  .tagline::after {
    width: 30px;
  }


  .location {
    margin-top: 20px;

    font-size: 10px;

    letter-spacing: 4px;
  }


  .payment {
    margin-top: 75px;
  }


  .transfer-title {
    margin-bottom: 25px;

    font-size: 25px;
  }


  .email {
    padding: 18px 10px;

    font-size: 14px;
  }


  .copy-btn {
    min-width: 95px;

    padding: 0 15px;
  }


  /* Smaller organic shapes */

  .green {
    width: 230px;
    height: 170px;

    top: -105px;
    left: -105px;
  }


  .orange {
    width: 215px;
    height: 160px;

    top: -100px;
    right: -100px;
  }


  .mustard {
    width: 240px;
    height: 175px;

    bottom: -115px;
    left: -120px;
  }


  .sage {
    width: 225px;
    height: 165px;

    bottom: -110px;
    right: -115px;
  }

}

</style>
</head>


<body>

<div class="page">


  <!-- Organic corner shapes -->

  <div class="blob green"></div>

  <div class="blob orange"></div>

  <div class="blob mustard"></div>

  <div class="blob sage"></div>



  <main class="card">


    <!-- Logo -->

    <div class="logo">

      Choi<span class="leaf-mark">

        <span class="leaf leaf-small"></span>

        <span class="leaf leaf-large"></span>

      </span>s Pantry

    </div>



    <!-- Tagline -->

    <div class="tagline">

      SMALL BATCH · FRESH FOOD

    </div>



    <!-- Location -->

    <div class="location">

      ST. JOHN'S, NL

    </div>



    <!-- Payment -->

    <section class="payment">


      <div class="transfer-title">

        e-Transfer

      </div>



      <div class="email-box">


        <div class="email">

          709kimchi@gmail.com

        </div>


        <button
          class="copy-btn"
          id="copyButton"
          onclick="copyEmail()"
        >

          COPY

        </button>


      </div>



      <div
        class="message"
        id="message"
      ></div>



      <div class="autodeposit">

        Auto-deposit enabled

      </div>


    </section>


  </main>


</div>



<script>

async function copyEmail() {

  const email =
    "709kimchi@gmail.com";

  const button =
    document.getElementById(
      "copyButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  try {

    await navigator.clipboard.writeText(
      email
    );


    button.innerText =
      "COPIED";


    message.innerText =
      "✓ Email copied";


    setTimeout(() => {

      button.innerText =
        "COPY";

      message.innerText =
        "";

    }, 1800);


  } catch {

    message.innerText =
      "709kimchi@gmail.com";

  }

}

</script>


</body>
</html>
